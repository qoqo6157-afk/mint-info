<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원가입 · mint info</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="card form-card">
      <a class="back" href="index.html">← 처음으로</a>
      <div class="eyebrow">INVITATION</div>
      <h1>초대 코드로 가입</h1>
      <p class="muted">관리자에게 받은 일회용 초대 코드가 필요합니다.</p>

      <form id="signupForm">
        <label>초대 코드<input id="inviteCode" required autocomplete="off" placeholder="MINT-XXXXXXXXXXXX"></label>
        <label>닉네임<input id="nickname" required maxlength="30" placeholder="표시할 이름"></label>
        <label>이메일<input id="email" required type="email" autocomplete="email"></label>
        <label>비밀번호<input id="password" required type="password" minlength="8" autocomplete="new-password"></label>
        <button class="btn primary wide" type="submit">가입하기</button>
      </form>

      <p id="message" class="message"></p>
      <p class="muted small">이미 계정이 있나요? <a href="login.html">로그인</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="signup.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · mint info</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="card form-card">
      <a class="back" href="index.html">← 처음으로</a>
      <div class="eyebrow">WELCOME BACK</div>
      <h1>로그인</h1>

      <form id="loginForm">
        <label>이메일<input id="email" required type="email" autocomplete="email"></label>
        <label>비밀번호<input id="password" required type="password" autocomplete="current-password"></label>
        <button class="btn primary wide" type="submit">로그인</button>
      </form>

      <p id="message" class="message"></p>
      <p class="muted small">초대 코드를 받았다면 <a href="signup.html">회원가입</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>관리자 · mint info</title>
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">← 내 페이지</a>
  </header>

  <main class="shell wide-shell">
    <section class="card">
      <div class="eyebrow">ADMIN</div>
      <h1>초대 코드 관리</h1>
      <p class="muted">코드는 한 번 사용되면 다시 사용할 수 없습니다.</p>

      <div class="admin-controls">
        <label>만료 기간
          <select id="expiresDays">
            <option value="">만료 없음</option>
            <option value="1">1일</option>
            <option value="7" selected>7일</option>
            <option value="30">30일</option>
          </select>
        </label>
        <button id="createBtn" class="btn primary">새 초대 코드 발급</button>
      </div>

      <p id="message" class="message"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>코드</th><th>상태</th><th>생성일</th><th>만료일</th><th>사용자</th></tr>
          </thead>
          <tbody id="codesBody"></tbody>
        </table>
      </div>
    </section>
  
    
    <section class="card blocked-domain-card">
      <div class="eyebrow">DOMAIN BLOCK</div>
      <h2>사이트 주소 차단</h2>
      <p class="muted">가입에 사용하지 못하게 할 주소 이름을 등록할 수 있어요. 언제든지 차단 해제가 가능합니다.</p>

      <div class="admin-controls blocked-domain-controls">
        <label>차단할 주소 이름
          <input id="blockedDomainInput" maxlength="30" autocomplete="off" autocapitalize="none"
                 spellcheck="false" placeholder="예: mint123">
        </label>
        <button id="addBlockedDomainBtn" class="btn primary" type="button">사용 금지</button>
      </div>

      <p id="blockedDomainMessage" class="message"></p>
      <div id="blockedDomainList" class="blocked-domain-list"></div>
    </section>

    <section class="card font-admin-card">
      <div class="eyebrow">SITE FONTS</div>
      <h2>사이트 폰트 업로드</h2>
      <p class="muted">GitHub가 아니라 Supabase Storage에 올립니다. 폰트 7개를 한 번만 업로드하면 에디터와 공개 페이지에서 바로 사용합니다.</p>

      <input id="siteFontInput" type="file" accept=".ttf,.otf,.woff,.woff2" multiple>
      <button id="uploadFontsBtn" class="btn primary" type="button">선택한 폰트 업로드</button>
      <p id="fontUploadMessage" class="message"></p>

      <div class="font-status-grid" id="fontStatusGrid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js?v=30"></script>
</body>
</html>
